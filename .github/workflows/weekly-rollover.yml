name: Weekly Challenge Rollover

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview Discord message without saving or posting'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  rollover:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weekly rollover
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python weekly-rollover.py

      - name: Commit and push changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add golden_tee_leaderboard.json weekly_challenge.json discord_preview.txt
          if ! git diff --staged --quiet; then
            git commit -m "Weekly rollover - $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
